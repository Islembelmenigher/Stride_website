<section id="flavors">

    <h2 class="in-head" id="inHead">REAL FOOD,<br>FIRST</h2>
    <div class="in-icons" id="inIcons">
      <button class="in-ico on" data-step="0" aria-label="Step 1: real food">
        <svg viewBox="0 0 24 24"><path d="M5 19C5 11 10 6 19 6c0 8-5 13-13 13z"/><path d="M5 19c3-4 6-6 9-7"/></svg>
      </button>
      <button class="in-ico" data-step="1" aria-label="Step 2: pressed, not baked">

  <div class="cards" id="cards"></div>
</section>
